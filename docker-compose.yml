# scrocco-llm · runtime containerizzato — profilo MINIMALE (solo gateway)
#
#   docker compose up -d          # solo il gateway (questo file)
#   docker compose -f docker-compose.yml -f docker-compose.stt.yml up -d    # + STT locale
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up -d    # + Web UI
#   docker compose -f docker-compose.full.yml up -d                         # stack completo
#
# - var/ è BIND MOUNTATA: le credenziali (keys_rotation.csv) e la policy
#   (gateway.yaml) restano file dell'HOST; l'admin API del container le
#   modifica con rename atomico DENTRO il mount -> l'host vede tutto.
# - I segreti arrivano da .env.gateway (env_file): MAI nell'immagine.
#   Prima di avviare: cp .env.gateway.example .env.gateway  (e cambia la master key).
services:
  scrocco-llm:
    build:
      context: .
      args:
        UID: 1001          # allinea al tuo utente host (id -u) per i permessi di var/
        GID: 1001
    image: scrocco-llm:latest
    container_name: scrocco-llm
    env_file: .env.gateway
    environment:
      GATEWAY_HOST: 0.0.0.0        # dentro la rete docker; fuori solo via bind port
      GATEWAY_WATCH_SECONDS: "5"
    ports:
      - "127.0.0.1:4001:4001"      # loopback host-only, come systemd faceva
    volumes:
      - ./var:/app/var
    restart: unless-stopped
    # Stop: SIGTERM -> il gateway smette di accettare, attende le richieste in
    # volo (policy shutdown_drain_sec, default 10s) e POI salva ledger/stato.
    # Col default Docker (10s) il SIGKILL arrivava a drain appena finito,
    # troncando i salvataggi finali. Con piu' worker il supervisore attende
    # fino a GATEWAY_SHUTDOWN_TIMEOUT (55s): resta sotto questo valore.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
