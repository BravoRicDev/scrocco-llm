services:
  scrocco-web:
    build: .
    restart: unless-stopped
    env_file: .env
    cap_add:
      - NET_BIND_SERVICE          # node (non-root) puo' bindare la :80
    # Bind configurabile (default: solo loopback). Per esporre il pannello
    # (es. dietro un reverse-proxy o dentro una VPN) impostare WEB_BIND nel
    # file .env, es. WEB_BIND=10.0.0.1
    ports:
      - "${WEB_BIND:-127.0.0.1}:9120:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:                   # solo per il db
      scrocco-llm_default:        # per GATEWAY_URL=http://scrocco-llm:4001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrocco_web}
      POSTGRES_USER: ${POSTGRES_USER:-scwebuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scwebuser} -d ${POSTGRES_DB:-scrocco_web}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  scrocco-llm_default:
    external: true
