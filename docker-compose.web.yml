# scrocco-llm · overlay Web UI (pannello admin Node/Express + Postgres)
#
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up -d
#
# Richiede:
#   - web/.env  (cp web/.env.example web/.env)
#   - DB_PASSWORD nel file .env del progetto (root), usato per interpolare
#     la password di Postgres. Non è letto da web/.env.
#
# NOTA: il volume scrocco-web_pgdata è EXTERNAL: il DB deve già esistere
# (docker volume create scrocco-web_pgdata) e non viene cancellato da `down -v`.
services:
  # Pannello admin Node/Express (sorgente in web/): consolidato nel repo
  # scrocco-llm (prima viveva nel repo esterno scrocco-web).
  scrocco-web:
    build:
      context: ./web
    container_name: scrocco-web
    restart: unless-stopped
    env_file: web/.env
    cap_add:
      - NET_BIND_SERVICE          # node (non-root) puo' bindare la :80
    # Pubblicato sul bridge wireguard-ui (172.20.0.1) alla porta 9120.
    # wg-easy fa DNAT: http://10.9.0.111/ (dentro la VPN) -> 172.20.0.1:9120.
    ports:
      - "172.20.0.1:9120:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Postgres del pannello web. Volume EXTERNAL: riusa scrocco-web_pgdata
  # (il DB esistente del deploy precedente) per non perdere dati.
  db:
    image: postgres:16-alpine
    container_name: scrocco-web-db
    restart: unless-stopped
    volumes:
      - scrocco-web_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrocco_web}
      POSTGRES_USER: ${POSTGRES_USER:-scwebuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scwebuser} -d ${POSTGRES_DB:-scrocco_web}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scrocco-web_pgdata:
    external: true
