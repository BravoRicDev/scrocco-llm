name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Create CI environment files from examples
        run: |
          # .env.gateway con chiave master di test
          cp .env.gateway.example .env.gateway
          sed -i 's/sk-master-CHANGE-ME-xxxxxxxxxxxxxxxx/sk-test-master-key-ci-only/' .env.gateway
          
          # var/ con file example (già presenti nel repo)
          mkdir -p var
          cp var/gateway.yaml.example var/gateway.yaml
          cp var/keys_rotation.csv.example var/keys_rotation.csv

      - name: Build Docker image with docker compose
        run: docker compose build

      - name: Start gateway (no sidecar STT - i test API non lo richiedono)
        run: |
          docker compose up -d --no-deps scrocco-llm
          docker compose ps

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4001/healthz >/dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 2
          done
          echo "Service failed to become healthy"
          docker compose logs
          exit 1

      - name: Test /v1/chat/completions endpoint (expect 401 without auth)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:4001/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model":"scrocco-llm-test","messages":[{"role":"user","content":"ping"}]}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ "$http_code" = "401" ]; then
            echo "✓ Correctly returns 401 without authentication"
          else
            echo "✗ Expected 401, got $http_code"
            exit 1
          fi

      - name: Test /v1/models endpoint with master key
        run: |
          response=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer sk-test-master-key-ci-only" \
            http://127.0.0.1:4001/v1/models)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          echo "HTTP Status: $http_code"
          if [ "$http_code" = "200" ]; then
            echo "✓ /v1/models works with master key"
            echo "$body" | python3 -m json.tool | head -20
          else
            echo "✗ Expected 200, got $http_code"
            echo "$body"
            exit 1
          fi

      - name: Stop services
        if: always()
        run: |
          docker compose down -v